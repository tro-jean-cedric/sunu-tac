server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    # relative Location headers: redirects keep the host:port the browser used (port mapping, proxies)
    absolute_redirect off;

    # security headers
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # employee test (SPA) at the root
    location / { try_files $uri /index.html; }

    # HR console (SPA) — restrict to the HR network here if possible, e.g.:
    #   allow 10.12.0.0/16; deny all;
    location = /admin { return 301 /admin/; }
    location /admin/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /admin/index.html;
    }

    # old URLs (bookmarks, QR codes)
    location /test/ { return 301 /$is_args$args; }
    location /console/ { rewrite ^/console/(.*)$ /admin/$1 permanent; }

    location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; }

    # Claude AI endpoints stream Server-Sent Events: no buffering, long reads
    location /api/ai/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        gzip off;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }
}
